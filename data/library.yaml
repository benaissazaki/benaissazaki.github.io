# The /library page: a 3D room with a shelf per kind.
# cover:  optional image in static/img/library/ (otherwise a cover is drawn in the site's style);
#         books are from Open Library, games, movies and Lucky Luke from their Wikipedia articles
#         (The Finals has no box art: game-finals.jpg is its public-domain logo on a made-up cover)
# color:  spine / cover color motif: emoji drawn on generated covers
# note:   your comment, shown on the back cover and the card when the item is picked up

books:
  - title: The Lord of the Rings
    by: J.R.R. Tolkien
    year: 1954
    cover: book-lotr.jpg
    color: "#7a1f1f"
    note: "Read it sooo many times, still as enjoyable as the first time."
  - title: The Hobbit
    by: J.R.R. Tolkien
    year: 1937
    cover: book-hobbit.jpg
    color: "#2f6b4f"
    note: "Adventure, humor, emotions, moral...The gold standard for kids' books."
  - title: The Hound of the Baskervilles
    by: Arthur Conan Doyle
    year: 1902
    cover: book-baskervilles.jpg
    color: "#a8231d"
    note: "All Sherlock Holmes books belong here, but this one is the best."
  - title: The Shining
    by: Stephen King
    year: 1977
    cover: book-shining.jpg
    color: "#1c2a5c"
    note: "The book that made me realize that characters on paper can be as scary as a movie."
  - title: Notre-Dame de Paris
    by: Victor Hugo
    year: 1831
    cover: book-notre-dame.jpg
    color: "#1f2b4a"
    note: "Probably the best book in french literature."
  - title: Journey to the West
    by: Wu Cheng'en
    year: 1592
    cover: book-journey-west.jpg
    color: "#c9a227"
    note: "Reading in progress..."
  - title: Lucky Luke
    by: Morris
    year: 1946
    cover: book-luckyluke.jpg
    color: "#c8382a"
    note: "The original comics got me into reading, and I still pick them up now and then."

games:
  - title: Resident Evil 4
    cover: game-re4.jpg
    by: Capcom
    year: 2023
    platform: PC
    color: "#5a1414"
    note: "My favourite action-oriented Resident Evil and probably my favourite overall."
    motif: "🔪"
  - title: The Finals
    cover: game-finals.jpg
    by: Embark Studios
    year: 2023
    platform: PC
    color: "#e8442c"
    note: "Never thought I'd have this much fun in a competitive FPS."
    motif: "💥"
  - title: The Mummy
    cover: game-mummy.jpg
    by: Rebellion
    year: 2000
    platform: PS1
    color: "#b8862b"
    note: "Obscure childhood game that used to scare me to death, recently replayed it and it still does."
    motif: "🏺"
  - title: Devil May Cry 3
    cover: game-dmc3.jpg
    by: Capcom
    year: 2005
    platform: PS2
    color: "#6b0f1a"
    note: "If coolness was a video game, (Excellent OST)."
    motif: "😈"
  - title: "Metal Gear Rising: Revengeance"
    cover: game-mgrr.jpg
    by: PlatinumGames
    year: 2013
    platform: PS3
    color: "#2b2f36"
    note: "Over the top, cheesy, and extremely satisfying combat."
    motif: "⚡"
  - title: Resident Evil 2
    cover: game-re2.jpg
    by: Capcom
    year: 2019
    platform: PS4
    color: "#24324a"
    note: "My favorite survival horror game of the franchise (the OG RE1 on PSX is probably scarier but overall I prefer this one)."
    motif: "🧟"
  - title: Resident Evil Requiem
    cover: game-re9.jpg
    by: Capcom
    year: 2026
    platform: PS5
    color: "#3a1f3f"
    note: "Brilliantly mixed a lot of elements from the entire saga, could have been my favourite if not for the weak writing."
    motif: "🕯️"
  - title: Rocket League
    cover: game-rocketleague.jpg
    by: Psyonix
    year: 2015
    platform: PC
    color: "#1d5fbf"
    note: "I never raged while playing a game, until I played this."
    motif: "🚗"
  - title: God of War
    cover: game-gow.jpg
    by: Santa Monica Studio
    year: 2005
    platform: PS2
    color: "#8a1a12"
    note: "The second one is objectively better, but there is something unique about this one."
    motif: "⚔️"

