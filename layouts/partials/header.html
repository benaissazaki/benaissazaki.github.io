<header class="site-header">
    <div class="site-header__id">
        <a class="site-header__name" href="/">Zaki&nbsp;Benaissa</a>
        <p class="site-header__tagline">{{ site.Params.tagline }}<span class="caret" aria-hidden="true">_</span></p>
    </div>
    <nav class="site-nav" aria-label="Main">
        {{ $current := . }}
        {{ range site.Menus.main }}
        {{ $active := or (eq .URL $current.RelPermalink) (and (ne .URL "/") (hasPrefix $current.RelPermalink .URL)) }}
        <a href="{{ .URL }}" {{ if $active }}aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
    </nav>
</header>
