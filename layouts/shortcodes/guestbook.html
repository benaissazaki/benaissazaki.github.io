{{ with site.Params.giscus }}
{{ if .repoId }}
<div class="guestbook">
    <script src="https://giscus.app/client.js"
        data-repo="{{ .repo }}"
        data-repo-id="{{ .repoId }}"
        data-category="{{ .category }}"
        data-category-id="{{ .categoryId }}"
        data-mapping="specific"
        data-term="Guestbook"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="light"
        data-lang="en"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
    </script>
</div>
{{ else }}
<p class="under-construction">🚧 The guestbook is still being wired up. Until then, say hi at <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>. 🚧</p>
{{ end }}
{{ end }}
